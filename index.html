    :root {
    --ground: #FBFBFE; --panel: #FFFFFF; --ink: #16223C; --muted: #656F86; --faint: #98A0B3;
    --line: #E7E9F2; --line-strong: #D8DBE8; --blue: #2B5FE3; --blue-soft: #EAF0FE; --blue-ink: #1C43A8;
    --pink: #F0568C; --pink-soft: #FDEBF2; --pink-ink: #C43168; --good: #14A06A;
    --shadow: 0 1px 2px rgba(22,34,60,.04), 0 12px 30px -14px rgba(22,34,60,.16);
    --shadow-lg: 0 2px 4px rgba(22,34,60,.05), 0 26px 60px -22px rgba(22,34,60,.30);
    --radius: 18px; --radius-sm: 12px; --star: #E3E6F0;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0D1220; --panel: #161E33; --ink: #EAEDF6; --muted: #9AA3B8; --faint: #6C768E;
      --line: #26304A; --line-strong: #33405F; --blue: #5B87F2; --blue-soft: #182446; --blue-ink: #A9C1FA;
      --pink: #F573A2; --pink-soft: #351A28; --pink-ink: #F9AECB; --good: #35C088;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 34px -16px rgba(0,0,0,.6);
      --shadow-lg: 0 2px 6px rgba(0,0,0,.4), 0 30px 70px -24px rgba(0,0,0,.7); --star: #2C3652;
    }
  }
  :root[data-theme="light"] {
    --ground: #FBFBFE; --panel: #FFFFFF; --ink: #16223C; --muted: #656F86; --faint: #98A0B3;
    --line: #E7E9F2; --line-strong: #D8DBE8; --blue: #2B5FE3; --blue-soft: #EAF0FE; --blue-ink: #1C43A8;
    --pink: #F0568C; --pink-soft: #FDEBF2; --pink-ink: #C43168; --good:#14A06A;
    --shadow: 0 1px 2px rgba(22,34,60,.04), 0 12px 30px -14px rgba(22,34,60,.16);
    --shadow-lg: 0 2px 4px rgba(22,34,60,.05), 0 26px 60px -22px rgba(22,34,60,.30); --star:#E3E6F0;
  }
  :root[data-theme="dark"] {
    --ground: #0D1220; --panel: #161E33; --ink: #EAEDF6; --muted: #9AA3B8; --faint: #6C768E;
    --line: #26304A; --line-strong: #33405F; --blue: #5B87F2; --blue-soft: #182446; --blue-ink: #A9C1FA;
    --pink: #F573A2; --pink-soft: #351A28; --pink-ink: #F9AECB; --good:#35C088;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 34px -16px rgba(0,0,0,.6);
    --shadow-lg: 0 2px 6px rgba(0,0,0,.4), 0 30px 70px -24px rgba(0,0,0,.7); --star:#2C3652;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1,h2,h3 { text-wrap: balance; margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  a { color: var(--blue); text-decoration: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

  .topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px; padding: 14px clamp(16px,4vw,40px); background: color-mix(in srgb, var(--ground) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; background: none; border: 0; padding: 0; }
  .brand-mark { width: 34px; height: 34px; border-radius: 11px; flex: none; background: linear-gradient(135deg, var(--blue), var(--pink)); display: grid; place-items: center; color: #fff; font-size: 18px; box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--pink) 60%, transparent); }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.05; text-align: left; }
  .brand-name .sub { display: block; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; background: linear-gradient(90deg, var(--blue), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .spacer { flex: 1; }
  .icon-btn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; font-size: 16px; transition: .15s; }
  .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 1px solid transparent; padding: 11px 20px; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; transition: .16s; white-space: nowrap; }
  .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--blue) 70%, transparent); }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-pink { background: var(--pink); color: #fff; box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--pink) 70%, transparent); }
  .btn-pink:hover { transform: translateY(-1px); }
  .btn-ghost { background: var(--panel); color: var(--ink); border-color: var(--line-strong); }
  .btn-ghost:hover { border-color: var(--muted); }
  .btn-sm { padding: 8px 14px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

  .wrap { max-width: 1060px; margin: 0 auto; padding: clamp(20px,4vw,44px) clamp(16px,4vw,40px) 90px; }

  /* Hero + globe */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14px 0 30px; }
  .hero h1 { font-size: clamp(28px,5vw,44px); font-weight: 750; letter-spacing: -.025em; }
  .hero h1 .grad { font-family: "Avigea", Georgia, serif; font-weight: 400; font-size: 1.18em; letter-spacing: .005em; padding-right: .06em; background: linear-gradient(100deg, var(--blue), var(--pink)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--pink-ink); }
  .hero .lead { color: var(--muted); font-size: clamp(14.5px,2vw,16.5px); max-width: 44ch; margin: 12px 0 18px; }

  .globe-search { position: relative; width: min(360px, 84vw); margin: 0 auto 12px; z-index: 20; }
  .globe-search input { width: 100%; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 999px; padding: 10px 16px 10px 38px; font-size: 14px; color: var(--ink); box-shadow: var(--shadow); transition: .15s; }
  .globe-search input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .globe-search .si { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .gs-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden auto; max-height: 264px; }
  .gs-results button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 14px; background: none; border: 0; text-align: left; font-size: 14px; color: var(--ink); font-weight: 550; }
  .gs-results button:hover, .gs-results button.act { background: var(--blue-soft); }
  .gs-results .fl { font-size: 18px; }

  .map-stage { position: relative; width: 100%; max-width: 940px; margin: 2px auto 6px; }
  .map-wrap { position: relative; width: 100%; aspect-ratio: 12 / 5; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: color-mix(in srgb, var(--blue) 10%, var(--ground)); cursor: grab; touch-action: none; }

/* ============ Utils ============ */
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = sel => document.querySelector(sel);
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const DEG = Math.PI/180;
function flagFromISO(iso){ if(!iso||iso.length!==2) return '🏳️'; const A=0x1F1E6, c=iso.toUpperCase(); const a=c.charCodeAt(0)-65, b=c.charCodeAt(1)-65; if(a<0||a>25||b<0||b>25) return '🏳️'; return String.fromCodePoint(A+a)+String.fromCodePoint(A+b); }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2000); }

const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function fmtDate(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function dateRange(t){ if(t.startDate&&t.endDate) return fmtDate(t.startDate)+' → '+fmtDate(t.endDate); if(t.startDate) return 'Dès le '+fmtDate(t.startDate); return 'Dates à définir'; }
function daysUntil(iso){ if(!iso) return null; const n=new Date(); n.setHours(0,0,0,0); return Math.round((new Date(iso+'T00:00:00')-n)/86400000); }
function countdownLabel(t){ const startD=daysUntil(t.startDate); if(startD===null) return null; if(startD>0) return {txt:startD===1?'Demain !':'Dans '+startD+' jours',past:false}; const endD=daysUntil(t.endDate||t.startDate); if(endD!==null&&endD>=0) return {txt:'En cours ✦',past:false}; return {txt:'Souvenir',past:true}; }

/* ============ Storage (IndexedDB) ============ */
let STATE={trips:[]};
let VIEW={name:'home',tripId:null};
const DB_NAME='vul-db', STORE='kv';
function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function loadState(){ try{ const db=await openDB(); const v=await new Promise((res,rej)=>{ const t=db.transaction(STORE,'readonly').objectStore(STORE).get('state'); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); if(v&&v.trips) STATE=v; }catch(e){ try{ const ls=localStorage.getItem('vul-state'); if(ls) STATE=JSON.parse(ls); }catch(_){} } }
let saveTimer;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ try{ const db=await openDB(); db.transaction(STORE,'readwrite').objectStore(STORE).put(STATE,'state'); }catch(e){ try{ localStorage.setItem('vul-state',JSON.stringify(STATE)); }catch(_){} } },350); }

/* ============ Router ============ */
const tripById=id=>STATE.trips.find(t=>t.id===id);
const trip=()=>tripById(VIEW.tripId);
function go(name,tripId){ VIEW={name,tripId:tripId||null}; render(); window.scrollTo(0,0); }
function render(){ const app=$('#app'); if(VIEW.name==='trip'&&trip()){ app.innerHTML=renderTrip(trip()); } else { VIEW.name='home'; app.innerHTML=renderHome(); mountMap(); } }

/* ============ Home ============ */
function renderHome(){
  const trips=STATE.trips;
  const cards=trips.map(t=>{ const cd=countdownLabel(t); const nP=(t.places||[]).length,nT=(t.tiktoks||[]).length;
    return `<button class="trip-card" onclick="go('trip','${t.id}')">
      <div class="flags">${(t.countries||[]).map(c=>c.flag).join(' ')}</div>
      <div><div class="title">${esc(t.name)}</div><div class="dates">📅 ${esc(dateRange(t))}</div></div>
      <div class="foot">${cd?`<span class="countdown ${cd.past?'past':''}">${cd.txt}</span>`:''}
        ${nP?`<span class="chip-stat">${nP} lieu${nP>1?'x':''}</span>`:''}${nT?`<span class="chip-stat">${nT} TikTok</span>`:''}</div>
    </button>`; }).join('');
  return `<div class="wrap">
    <div class="hero">
      <h1>Prépare & documente <span class="grad">tes voyages</span></h1>
      <p class="lead">Fais tourner la planète, puis clique les pays où tu veux aller.</p>
      <div class="globe-search">
        <span class="si">🔍</span>
        <input id="geoSearch" placeholder="Chercher un pays…" autocomplete="off" spellcheck="false">
        <div class="gs-results hidden" id="geoResults"></div>
      </div>
      <div class="map-stage" id="mapStage">
        <div class="map-wrap" id="mapWrap">
          <svg id="worldMap" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="Carte du monde — glisse pour te déplacer, clique un pays"></svg>
          <div class="map-ctrls">
            <button onclick="zoomBy(0.7)" aria-label="Zoom avant" title="Zoom avant">＋</button>
            <button onclick="zoomBy(1.4286)" aria-label="Zoom arrière" title="Zoom arrière">−</button>
            <button onclick="resetView()" aria-label="Vue d’ensemble" title="Vue d’ensemble">⌖</button>
          </div>
        </div>
        <div class="map-tip" id="mapTip"></div>
      </div>
      <p class="map-hint">✋ Glisse pour te déplacer · molette / pincer pour zoomer · 👆 clique un pays</p>
      <div class="picker-bar">
        <div class="picker-chips" id="pickerChips"></div>
        <button class="btn btn-primary" id="createBtn" style="padding:12px 24px;font-size:15px" disabled onclick="createTripFromSelection()">＋ Préparer le voyage</button>
      </div>
    </div>
    <div class="section-head"><h2>Mes voyages</h2><span class="count">${trips.length?trips.length+' voyage'+(trips.length>1?'s':''):''}</span></div>
    ${trips.length?`<div class="grid">${cards}
      <button class="add-card" onclick="document.querySelector('.globe-stage').scrollIntoView({behavior:'smooth',block:'center'})"><span class="plus">＋</span>Nouveau voyage</button></div>`
      :`<div class="empty"><div style="font-size:34px;margin-bottom:8px">🧳</div>Aucun voyage pour l’instant.<br>Choisis des pays sur la planète pour commencer.</div>`}
  </div>`;
}

/* ============ 2D world map engine ============ */
const K=3, MAPW=360*K, MAPH=180*K;
const SEL=new Set();
const M={ svg:null, wrap:null, stage:null, tip:null, vb:{x:0,y:0,w:MAPW,h:MAPW/2.4}, aspect:2.4, drag:false, moved:0, lastx:0, lasty:0, hoverEl:null, paths:null, anim:false };
const projX=lon=>(lon+180)*K, projY=lat=>(90-lat)*K;
function ringPath(ring){ let d='',prev=null; for(let i=0;i<ring.length;i++){ let lon=ring[i][0]; const lat=ring[i][1]; if(prev!==null){ while(lon-prev>180)lon-=360; while(lon-prev<-180)lon+=360; } prev=lon; d+=(i?'L':'M')+projX(lon).toFixed(1)+' '+projY(lat).toFixed(1); } return d+'Z'; }
function isSkipped(f){ return f.i==='AQ'||f.n==='Antarctique'; }
function buildPaths(){ if(M.paths) return M.paths; let out=''; for(let k=0;k<GEO.length;k++){ const f=GEO[k]; if(isSkipped(f)) continue; let d=''; for(const poly of f.p) for(const ring of poly) d+=ringPath(ring); out+='<path class="cty" data-i="'+(k+1)+'" fill-rule="evenodd" d="'+d+'"></path>'; } M.paths=out; return out; }
function graticule(){ let g=''; for(let lon=-150;lon<=150;lon+=30) g+='<line x1="'+projX(lon)+'" y1="0" x2="'+projX(lon)+'" y2="'+MAPH+'"/>'; for(let lat=-60;lat<=60;lat+=30) g+='<line x1="0" y1="'+projY(lat)+'" x2="'+MAPW+'" y2="'+projY(lat)+'"/>'; return g; }
function bboxOf(f){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for(const poly of f.p) for(const ring of poly){ let prev=null; for(let i=0;i<ring.length;i++){ let lon=ring[i][0]; const lat=ring[i][1]; if(prev!==null){ while(lon-prev>180)lon-=360; while(lon-prev<-180)lon+=360; } prev=lon; const X=projX(lon),Y=projY(lat); if(X<a)a=X; if(Y<b)b=Y; if(X>c)c=X; if(Y>d)d=Y; } } return {minx:a,miny:b,maxx:c,maxy:d}; }
function clampVB(){ const v=M.vb, minW=MAPW/9; if(v.w>MAPW)v.w=MAPW; if(v.w<minW)v.w=minW; v.h=v.w/M.aspect; if(v.h>MAPH){ v.h=MAPH; v.w=v.h*M.aspect; if(v.w>MAPW)v.w=MAPW; } if(v.x<0)v.x=0; if(v.y<0)v.y=0; if(v.x+v.w>MAPW)v.x=MAPW-v.w; if(v.y+v.h>MAPH)v.y=MAPH-v.h; if(v.x<0)v.x=0; if(v.y<0)v.y=0; }
function applyVB(){ clampVB(); M.svg.setAttribute('viewBox',M.vb.x.toFixed(2)+' '+M.vb.y.toFixed(2)+' '+M.vb.w.toFixed(2)+' '+M.vb.h.toFixed(2)); }
function pathEl(id){ return M.svg?M.svg.querySelector('path[data-i="'+id+'"]'):null; }

function mountMap(){
  M.svg=$('#worldMap'); M.wrap=$('#mapWrap'); M.stage=$('#mapStage'); M.tip=$('#mapTip'); if(!M.svg) return;
  M.svg.innerHTML='<rect class="ocean" x="-300" y="-300" width="'+(MAPW+600)+'" height="'+(MAPH+600)+'"/><g class="grat">'+graticule()+'</g><g class="lands">'+buildPaths()+'</g>';
  const r0=M.wrap.getBoundingClientRect(); M.aspect=(r0.height>0?r0.width/r0.height:2.4);
  M.vb={x:0,y:projY(85),w:MAPW,h:MAPW/M.aspect}; applyVB();
  SEL.forEach(id=>{ const el=pathEl(id); if(el)el.classList.add('sel'); });
  updatePicker();

  M.svg.addEventListener('pointerdown',e=>{ M.drag=true; M.moved=0; M.lastx=e.clientX; M.lasty=e.clientY; M.wrap.classList.add('drag'); M.svg.setPointerCapture(e.pointerId); });
  M.svg.addEventListener('pointermove',e=>{
    if(M.drag){ const dx=e.clientX-M.lastx, dy=e.clientY-M.lasty; M.lastx=e.clientX; M.lasty=e.clientY; M.moved+=Math.abs(dx)+Math.abs(dy);
      const rect=M.svg.getBoundingClientRect(); M.vb.x-=dx*(M.vb.w/rect.width); M.vb.y-=dy*(M.vb.h/rect.height); applyVB(); M.tip.classList.remove('show'); return; }
    const p=e.target.closest('path[data-i]');
    if(p){ if(M.hoverEl!==p){ if(M.hoverEl)M.hoverEl.classList.remove('hov'); p.classList.add('hov'); M.hoverEl=p; }
      const f=GEO[+p.dataset.i-1], r=M.stage.getBoundingClientRect(); M.tip.textContent=flagFromISO(f.i)+' '+f.n; M.tip.style.left=(e.clientX-r.left)+'px'; M.tip.style.top=(e.clientY-r.top)+'px'; M.tip.classList.add('show'); }
    else { if(M.hoverEl){ M.hoverEl.classList.remove('hov'); M.hoverEl=null; } M.tip.classList.remove('show'); }
  });
  const end=e=>{ if(!M.drag) return; M.drag=false; M.wrap.classList.remove('drag'); if(M.moved<8){ const p=e.target.closest&&e.target.closest('path[data-i]'); if(p) toggleCountry(+p.dataset.i); } };
  M.svg.addEventListener('pointerup',end);
  M.svg.addEventListener('pointercancel',()=>{ M.drag=false; M.wrap.classList.remove('drag'); });
  M.svg.addEventListener('pointerleave',()=>{ if(M.hoverEl){M.hoverEl.classList.remove('hov');M.hoverEl=null;} M.tip.classList.remove('show'); });
  M.wrap.addEventListener('wheel',e=>{ e.preventDefault(); const rect=M.svg.getBoundingClientRect(); const fx=(e.clientX-rect.left)/rect.width, fy=(e.clientY-rect.top)/rect.height;
    const px=M.vb.x+fx*M.vb.w, py=M.vb.y+fy*M.vb.h; let nw=M.vb.w*Math.exp(e.deltaY*0.0016); nw=Math.max(MAPW/9,Math.min(MAPW,nw)); const nh=nw/M.aspect; M.vb.x=px-fx*nw; M.vb.y=py-fy*nh; M.vb.w=nw; M.vb.h=nh; applyVB(); },{passive:false});
  if(!mountMap._resize){ mountMap._resize=true; window.addEventListener('resize',()=>{ if(!M.wrap)return; const r=M.wrap.getBoundingClientRect(); if(r.height>0){ M.aspect=r.width/r.height; applyVB(); } }); }
  setupSearch();
}
function zoomBy(factor){ const cx=M.vb.x+M.vb.w/2, cy=M.vb.y+M.vb.h/2; let nw=Math.max(MAPW/9,Math.min(MAPW,M.vb.w*factor)); M.vb.w=nw; M.vb.h=nw/M.aspect; M.vb.x=cx-M.vb.w/2; M.vb.y=cy-M.vb.h/2; applyVB(); }
function resetView(){ animateVB({x:0,y:projY(85),w:MAPW,h:MAPW/M.aspect}); }
function animateVB(target){ const from={x:M.vb.x,y:M.vb.y,w:M.vb.w,h:M.vb.h}; const t0=performance.now(),dur=560; M.anim=true;
  (function step(t){ const k=Math.min(1,(t-t0)/dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; M.vb={x:from.x+(target.x-from.x)*e,y:from.y+(target.y-from.y)*e,w:from.w+(target.w-from.w)*e,h:from.h+(target.h-from.h)*e}; applyVB(); if(k<1)requestAnimationFrame(step); else M.anim=false; })(performance.now());
}
function flyToCountry(k){ const f=GEO[k]; const bb=bboxOf(f); const bw=bb.maxx-bb.minx, bh=bb.maxy-bb.miny; const pad=Math.max(bw,bh)*0.55+16;
  let w=Math.max(bw+pad*2,(bh+pad*2)*M.aspect); w=Math.max(MAPW/9,Math.min(MAPW,w)); const h=w/M.aspect; const cx=(bb.minx+bb.maxx)/2, cy=(bb.miny+bb.maxy)/2; animateVB({x:cx-w/2,y:cy-h/2,w,h}); }

function toggleCountry(id){ const el=pathEl(id); if(SEL.has(id)){ SEL.delete(id); if(el)el.classList.remove('sel'); } else { SEL.add(id); if(el)el.classList.add('sel'); } updatePicker(); }
function updatePicker(){ const box=$('#pickerChips'), btn=$('#createBtn'); if(!box) return; const ids=[...SEL];
  box.innerHTML=ids.map(id=>{ const f=GEO[id-1]; return '<span class="pchip"><span class="fl">'+flagFromISO(f.i)+'</span>'+esc(f.n)+'<button onclick="toggleCountry('+id+')" aria-label="Retirer">✕</button></span>'; }).join('')||'<span style="color:var(--faint);font-size:13px">Aucun pays choisi</span>';
  if(btn){ btn.disabled=ids.length===0; btn.textContent=ids.length?'＋ Préparer le voyage ('+ids.length+' pays)':'＋ Préparer le voyage'; }
}
function createTripFromSelection(){ const ids=[...SEL]; if(!ids.length) return; const countries=ids.map(id=>{ const f=GEO[id-1]; return {name:f.n,flag:flagFromISO(f.i),iso:f.i,regions:[]}; });
  const names=countries.map(c=>c.name); const name=names.length<=2?names.join(' & '):names.slice(0,2).join(', ')+' +'+(names.length-2);
  const t={ id:uid(), name, createdAt:new Date().toISOString(), countries, startDate:'', endDate:'', tiktoks:[], places:[], albums:[] };
  STATE.trips.unshift(t); save(); SEL.clear(); go('trip',t.id); toast('Voyage créé ✦'); }

function setupSearch(){
  const inp=$('#geoSearch'), res=$('#geoResults'); if(!inp) return; let acts=[], ai=-1;
  function close(){ res.classList.add('hidden'); res.innerHTML=''; acts=[]; ai=-1; }
  function paint(){ res.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('act',i===ai)); }
  function run(){ const q=norm(inp.value.trim()); if(!q){ close(); return; } const hits=[];
    for(let k=0;k<GEO.length;k++){ if(isSkipped(GEO[k])) continue; if(norm(GEO[k].n).includes(q)){ hits.push(k); if(hits.length>=8) break; } }
    if(!hits.length){ close(); return; } acts=hits; ai=-1;
    res.innerHTML=hits.map(k=>'<button onclick="pickSearch('+k+')"><span class="fl">'+flagFromISO(GEO[k].i)+'</span>'+esc(GEO[k].n)+'</button>').join(''); res.classList.remove('hidden'); }
  inp.addEventListener('input',run);
  inp.addEventListener('keydown',e=>{ if(res.classList.contains('hidden')) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); ai=Math.min(acts.length-1,ai+1); paint(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); ai=Math.max(0,ai-1); paint(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(acts.length) pickSearch(acts[ai<0?0:ai]); }
    else if(e.key==='Escape'){ close(); } });
  document.addEventListener('click',e=>{ if(!e.target.closest('.globe-search')) close(); });
  window.pickSearch=k=>{ flyToCountry(k); if(!SEL.has(k+1)) toggleCountry(k+1); close(); inp.value=''; };
}

/* ---- Per-country map + city picker (used in trip detail) ---- */
let _isoIdx=null,_nameIdx=null;
function geoIndexOfCountry(c){ if(!_isoIdx){ _isoIdx={}; _nameIdx={}; GEO.forEach((g,i)=>{ if(g.i)_isoIdx[g.i]=i; _nameIdx[g.n]=i; }); } if(c.iso&&_isoIdx[c.iso]!=null)return _isoIdx[c.iso]; if(_nameIdx[c.name]!=null)return _nameIdx[c.name]; return -1; }
function citiesFor(k){ const iso=GEO[k].i; return (typeof CITIES!=='undefined'&&iso&&CITIES[iso])?CITIES[iso]:[]; }
function bboxLargest(f){ let best=null,bn=-1; for(const poly of f.p){ let n=0; for(const ring of poly)n+=ring.length; if(n>bn){bn=n;best=poly;} } let a=1e9,b=1e9,c=-1e9,dd=-1e9; for(const ring of best){ let prev=null; for(let i=0;i<ring.length;i++){ let lon=ring[i][0]; const lat=ring[i][1]; if(prev!==null){ while(lon-prev>180)lon-=360; while(lon-prev<-180)lon+=360; } prev=lon; const X=projX(lon),Y=projY(lat); if(X<a)a=X; if(Y<b)b=Y; if(X>c)c=X; if(Y>dd)dd=Y; } } return {minx:a,miny:b,maxx:c,maxy:dd}; }
function countryMapSVG(k, tripId, ci){
  const f=GEO[k]; const cities=citiesFor(k);
  let bb;
  if(cities.length){ let a=1e9,b=1e9,c=-1e9,dd=-1e9; for(const ct of cities){ const X=projX(ct[1]),Y=projY(ct[2]); if(X<a)a=X; if(Y<b)b=Y; if(X>c)c=X; if(Y>dd)dd=Y; } bb={minx:a,miny:b,maxx:c,maxy:dd}; }
  else bb=bboxLargest(f);
  let bw=(bb.maxx-bb.minx), bh=(bb.maxy-bb.miny); if(bw<24)bw=24; if(bh<24)bh=24;
  const cx0=(bb.minx+bb.maxx)/2, cy0=(bb.miny+bb.maxy)/2;
  const padx=bw*0.18+4, pady=bh*0.18+4; const x=cx0-bw/2-padx, y=cy0-bh/2-pady, w=bw+padx*2, h=bh+pady*2;
  const dim=Math.max(w,h); const r=+(dim*0.011).toFixed(2); const fs=+(dim*0.028).toFixed(2);
  let d=''; for(const poly of f.p) for(const ring of poly) d+=ringPath(ring);
  const t=tripById(tripId); const regions=(t&&t.countries[ci].regions)||[];
  const gid='cg_'+tripId+'_'+ci;
  let dots='',labels='';
  cities.forEach(c=>{ const cx=+projX(c[1]).toFixed(2), cy=+projY(c[2]).toFixed(2); const on=regions.includes(c[0]); const jn=(''+c[0]).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    dots+='<circle class="cdot'+(on?' on':'')+'" cx="'+cx+'" cy="'+cy+'" r="'+(on?(r*1.7).toFixed(2):r)+'" '+(on?'fill="url(#'+gid+')" ':'')+'onclick="toggleCity(\''+tripId+'\','+ci+',\''+jn+'\')"><title>'+esc(c[0])+'</title></circle>';
    if(on) labels+='<text class="clbl" x="'+(cx+r*2.4).toFixed(2)+'" y="'+(cy+fs*0.35).toFixed(2)+'" font-size="'+fs+'">'+esc(c[0])+'</text>';
  });
  return '<svg class="cmap" viewBox="'+x.toFixed(2)+' '+y.toFixed(2)+' '+w.toFixed(2)+' '+h.toFixed(2)+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--blue)"/><stop offset="1" stop-color="var(--pink)"/></linearGradient></defs>'
    +'<path class="cshape" fill-rule="evenodd" d="'+d+'"/>'+dots+labels+'</svg>';
}
function toggleCity(id,ci,name){ withTrip(id,t=>{ const arr=t.countries[ci].regions; const i=arr.indexOf(name); if(i>=0)arr.splice(i,1); else arr.push(name); }); render(); }

/* ============ Trip detail (unchanged features) ============ */
function renderTrip(t){ const cd=countdownLabel(t);
  return `<div class="wrap">
    <button class="back" onclick="go('home')">← Tous mes voyages</button>
    <div class="trip-head">
      <div class="flags-lg">${t.countries.map(c=>c.flag).join(' ')}</div>
      <div style="flex:1;min-width:200px">
        <h1 contenteditable="true" spellcheck="false" onblur="renameTrip('${t.id}',this.textContent)" style="outline:none">${esc(t.name)}</h1>
        <div class="meta"><span>📅 ${esc(dateRange(t))}</span>${cd?`<span class="countdown ${cd.past?'past':''}">${cd.txt}</span>`:''}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="deleteTrip('${t.id}')" style="color:var(--pink-ink)">🗑 Supprimer</button>
    </div>
    ${cardDates(t)}${cardCountries(t)}${cardTiktok(t)}${cardPlaces(t)}${cardAlbums(t)}
  </div>`;
}
function cardDates(t){ return `<div class="card"><div class="card-head"><span class="ic pink">📅</span><h3>Dates du voyage</h3></div>
  <div class="field-row">
    <div style="flex:1;min-width:150px"><label class="lbl">Départ</label><input type="date" class="date-input" value="${t.startDate||''}" onchange="setDate('${t.id}','startDate',this.value)"></div>
    <div style="flex:1;min-width:150px"><label class="lbl">Retour</label><input type="date" class="date-input" value="${t.endDate||''}" onchange="setDate('${t.id}','endDate',this.value)"></div>
  </div></div>`; }
function cardCountries(t){ const blocks=t.countries.map((c,ci)=>{
    const k=geoIndexOfCountry(c); const hasMap=k>=0 && !isSkipped(GEO[k]); const cities=hasMap?citiesFor(k):[];
    const nSel=(c.regions||[]).length;
    const chips=(c.regions||[]).map((r,ri)=>`<span class="chip">${esc(r)}<button onclick="delRegion('${t.id}',${ci},${ri})" aria-label="Retirer">✕</button></span>`).join('');
    return `<div class="country-block">
      <div class="ct"><span class="fl">${c.flag}</span>${esc(c.name)}${nSel?`<span class="ct-count">${nSel} ville${nSel>1?'s':''}</span>`:''}</div>
      ${hasMap?`<div class="cmap-hint">${cities.length?'👆 Clique les villes que tu veux visiter — elles s’allument en dégradé':'Pas de villes pré-listées, ajoute-les à la main ci-dessous'}</div>${countryMapSVG(k,t.id,ci)}`:''}
      <div class="chips">${chips}<button class="chip-add" onclick="addRegion('${t.id}',${ci})">＋ Ville / lieu</button></div>
    </div>`; }).join('');
  return `<div class="card"><div class="card-head"><span class="ic blue">🗺️</span><h3>Pays & villes à visiter</h3><span class="hint">Choisis les villes sur la carte</span></div>${blocks}</div>`; }
function cardTiktok(t){ const items=(t.tiktoks||[]).map(x=>`<div class="link-item"><span class="lic tt">♪</span>
    <div class="lbody"><div class="lname">${esc(x.label||'Collection TikTok')}</div><div class="lurl">${esc(x.url)}</div></div>
    <a class="btn btn-ghost btn-sm" href="${esc(x.url)}" target="_blank" rel="noopener">Ouvrir ↗</a>
    <button class="del" onclick="delItem('${t.id}','tiktoks','${x.id}')" aria-label="Supprimer">🗑</button></div>`).join('');
  return `<div class="card"><div class="card-head"><span class="ic pink">♪</span><h3>Collections TikTok</h3><span class="hint">Idées repérées avant le voyage</span></div>
    ${items||'<div class="sub-empty">Aucune collection pour l’instant.</div>'}
    <div class="field-row" style="margin-top:12px"><input class="input input-inline" id="tt-url-${t.id}" placeholder="Colle un lien TikTok…">
      <input class="input" style="flex:.6;min-width:130px" id="tt-lbl-${t.id}" placeholder="Titre (facultatif)">
      <button class="btn btn-pink btn-sm" onclick="addTiktok('${t.id}')">Ajouter</button></div></div>`; }
function cardPlaces(t){ const tiles=(t.places||[]).map(p=>`<div class="place"><div class="ph"><img src="${p.img}" alt="${esc(p.name||'Lieu')}">
    <button class="del" onclick="delItem('${t.id}','places','${p.id}')" aria-label="Supprimer">✕</button></div>
    <div class="pb"><input class="pname" value="${esc(p.name||'')}" placeholder="Nom du lieu…" onchange="setPlaceName('${t.id}','${p.id}',this.value)">
      <div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=(p.rating||0)?'on':''}" onclick="setRating('${t.id}','${p.id}',${n})" aria-label="${n} étoiles">★</button>`).join('')}</div></div></div>`).join('');
  return `<div class="card"><div class="card-head"><span class="ic blue">📸</span><h3>Lieux visités</h3><span class="hint">Screenshots + note sur 5</span></div>
    <div class="places-grid">${tiles}<label class="upload-tile"><span class="u">＋</span>Ajouter des screenshots
      <input type="file" accept="image/*" multiple class="hidden" onchange="addPlaces('${t.id}',this)"></label></div>
    ${(t.places||[]).length?'':'<div class="sub-empty" style="margin-top:10px">Importe des captures d’écran des lieux visités et donne-leur une note.</div>'}</div>`; }
function cardAlbums(t){ const items=(t.albums||[]).map(x=>`<div class="link-item"><span class="lic dr">▲</span>
    <div class="lbody"><div class="lname">${esc(x.name||'Album Drive')}</div><div class="lurl">${esc(x.url)}</div></div>
    <a class="btn btn-ghost btn-sm" href="${esc(x.url)}" target="_blank" rel="noopener">Ouvrir ↗</a>
    <button class="del" onclick="delItem('${t.id}','albums','${x.id}')" aria-label="Supprimer">🗑</button></div>`).join('');
  return `<div class="card"><div class="card-head"><span class="ic blue">🖼️</span><h3>Albums photos (Drive)</h3><span class="hint">Liens vers tes dossiers Google Drive</span></div>
    ${items||'<div class="sub-empty">Aucun album lié.</div>'}
    <div class="field-row" style="margin-top:12px"><input class="input input-inline" id="dr-url-${t.id}" placeholder="Colle un lien Drive…">
      <input class="input" style="flex:.6;min-width:130px" id="dr-lbl-${t.id}" placeholder="Nom de l’album">
      <button class="btn btn-primary btn-sm" onclick="addAlbum('${t.id}')">Ajouter</button></div></div>`; }

/* mutations */
function withTrip(id,fn){ const t=tripById(id); if(t){ fn(t); save(); } }
function renameTrip(id,name){ withTrip(id,t=>{ t.name=name.trim()||t.name; }); }
function deleteTrip(id){ const t=tripById(id); if(!confirm('Supprimer le voyage « '+(t?t.name:'')+' » et tout son contenu ?')) return; STATE.trips=STATE.trips.filter(x=>x.id!==id); save(); go('home'); toast('Voyage supprimé'); }
function setDate(id,key,val){ withTrip(id,t=>{ t[key]=val; }); render(); }
function addRegion(id,ci){ const name=prompt('Région ou ville à visiter :'); if(!name||!name.trim()) return; withTrip(id,t=>t.countries[ci].regions.push(name.trim())); render(); }
function delRegion(id,ci,ri){ withTrip(id,t=>t.countries[ci].regions.splice(ri,1)); render(); }
function normUrl(u){ return /^https?:\/\//i.test(u)?u:'https://'+u; }
function addTiktok(id){ const url=$('#tt-url-'+id).value.trim(); if(!url) return; const label=$('#tt-lbl-'+id).value.trim(); withTrip(id,t=>t.tiktoks.push({id:uid(),url:normUrl(url),label})); render(); }
function addAlbum(id){ const url=$('#dr-url-'+id).value.trim(); if(!url) return; const name=$('#dr-lbl-'+id).value.trim(); withTrip(id,t=>t.albums.push({id:uid(),url:normUrl(url),name})); render(); }
function delItem(id,key,itemId){ withTrip(id,t=>{ t[key]=t[key].filter(x=>x.id!==itemId); }); render(); }
function setPlaceName(id,pid,val){ withTrip(id,t=>{ const p=t.places.find(x=>x.id===pid); if(p)p.name=val; }); }
function setRating(id,pid,n){ withTrip(id,t=>{ const p=t.places.find(x=>x.id===pid); if(p)p.rating=(p.rating===n?0:n); }); render(); }
function addPlaces(id,input){ const files=Array.from(input.files||[]); if(!files.length) return; let done=0;
  files.forEach(f=>{ if(!f.type.startsWith('image/')){ if(++done===files.length) render(); return; }
    compress(f,dataUrl=>{ withTrip(id,t=>t.places.push({id:uid(),img:dataUrl,name:'',rating:0})); if(++done===files.length){ render(); toast(files.length+' lieu'+(files.length>1?'x ajoutés':' ajouté')+' ✦'); } }); });
  input.value=''; }
function compress(file,cb){ const reader=new FileReader(); reader.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=1400; let w=img.width,h=img.height; if(w>max||h>max){ const s=Math.min(max/w,max/h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); cb(cv.toDataURL('image/jpeg',0.82)); };
    img.onerror=()=>cb(reader.result); img.src=reader.result; }; reader.readAsDataURL(file); }

/* theme */
function initTheme(){ const saved=localStorage.getItem('vul-theme'); if(saved) document.documentElement.setAttribute('data-theme',saved);
  $('#themeBtn').onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const next=cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',next); localStorage.setItem('vul-theme',next); }; }

/* boot */
(async function(){ initTheme(); await loadState(); render(); })();
</script>
